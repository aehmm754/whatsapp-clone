<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #111b21;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* شاشة تسجيل الدخول وإنشاء الحساب */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #0c1317;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: #111b21;
            border: 1px solid #222e35;
            padding: 35px 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            color: #e9edef;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .auth-card .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            background: #00a884;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        .auth-card h2 {
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 500;
        }

        .auth-card input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: #202c33;
            border: 1px solid #2a3942;
            border-radius: 8px;
            color: #e9edef;
            font-size: 15px;
            outline: none;
        }

        .auth-card input:focus {
            border-color: #00a884;
        }

        .auth-card button.btn-primary {
            width: 100%;
            padding: 12px;
            background: #00a884;
            color: #111b21;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-card button.btn-primary:hover {
            background: #02906f;
        }

        .auth-toggle {
            margin-top: 20px;
            font-size: 14px;
            color: #00a884;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .alert-msg {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            display: block;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            display: block;
        }

        /* الإطار الرئيسي لواتساب */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            background: #111b21;
        }

        /* القائمة الجانبية (المحادثات) */
        .sidebar {
            width: 350px;
            border-left: 1px solid #222e35;
            display: flex;
            flex-direction: column;
            background: #111b21;
        }

        .sidebar-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .search-box {
            padding: 8px 12px;
            background: #111b21;
        }

        .search-input {
            width: 100%;
            padding: 8px 15px;
            background: #202c33;
            border: none;
            border-radius: 8px;
            color: #d1d7db;
            font-size: 14px;
            outline: none;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #222e35;
            transition: 0.2s;
        }

        .user-item:hover,
        .user-item.active {
            background: #202c33;
        }

        .user-info {
            margin-right: 12px;
            flex: 1;
            text-align: right;
        }

        .user-name {
            font-size: 16px;
            color: #e9edef;
            font-weight: 500;
        }

        .user-status {
            font-size: 12px;
            color: #8696a0;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00a884;
            display: inline-block;
            margin-left: 5px;
        }

        /* نافذة الدردشة الرئيسية */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
            position: relative;
        }

        .chat-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222e35;
        }

        .chat-header .title {
            margin-right: 12px;
            color: #e9edef;
            font-size: 16px;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8696a0;
            text-align: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#1f2c34 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* فقاعات الرسائل */
        .msg {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            position: relative;
            word-wrap: break-word;
            color: #e9edef;
        }

        .msg.me {
            align-self: flex-start;
            background: #005c4b;
        }

        .msg.other {
            align-self: flex-end;
            background: #202c33;
        }

        .msg-time {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
            text-align: left;
        }

        .msg img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
        }

        .msg audio {
            width: 240px;
            height: 38px;
            margin-top: 5px;
            outline: none;
        }

        /* شريط الإدخال والتسجيل */
        .chat-footer {
            background: #202c33;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 10px 16px;
            background: #2a3942;
            border: none;
            border-radius: 8px;
            color: #d1d7db;
            font-size: 15px;
            outline: none;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .btn-icon:hover {
            color: #d1d7db;
        }

        .btn-icon.recording {
            background: #ef4444 !important;
            color: white !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }

            .chat-area {
                display: none;
                width: 100%;
            }

            .app-container.chat-active .sidebar {
                display: none;
            }

            .app-container.chat-active .chat-area {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <!-- شاشة الدخول / إنشاء حساب -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <div class="logo">💬</div>
            <h2 id="auth-title">تسجيل الدخول</h2>
            <div id="auth-alert" class="alert-msg"></div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="auth-username" placeholder="اسم المستخدم" required autocomplete="off">
                <input type="password" id="auth-password" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-primary" id="auth-submit">دخول</button>
            </form>
            <a class="auth-toggle" id="auth-toggle" onclick="toggleAuthMode()">ليس لديك حساب؟ إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- الواجهة الأساسية للتطبيق -->
    <div class="app-container" id="app-container">
        <!-- المحادثات الجانبية -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="user-avatar" id="my-avatar">U</div>
                    <span id="my-name" style="color: #e9edef; font-weight: 500;"></span>
                </div>
                <button class="btn-icon" onclick="logout()" title="تسجيل الخروج" style="font-size: 18px;">🚪</button>
            </div>
            <div class="search-box">
                <input type="text" class="search-input" id="search-input" placeholder="بحث أو بدء محادثة جديدة..."
                    onkeyup="filterUsers()">
            </div>
            <ul class="user-list" id="users-list"></ul>
        </div>

        <!-- نافذة المحادثة -->
        <div class="chat-area" id="chat-area">
            <div class="chat-empty" id="chat-empty">
                <div style="font-size: 60px; margin-bottom: 10px;">💻</div>
                <h3>واتساب للويب</h3>
                <p style="margin-top: 6px; font-size: 14px;">اختر أي مستخدم من القائمة للبدء في الدردشة الفورية</p>
            </div>

            <div id="chat-active" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <button class="btn-icon" onclick="closeChat()" style="margin-left: 8px; display: none;"
                        id="back-btn">⬅</button>
                    <div class="user-avatar" id="active-avatar">?</div>
                    <div class="title">
                        <div id="active-name" style="font-weight: 500;"></div>
                        <div id="active-status" style="font-size: 12px; color: #8696a0;"></div>
                    </div>
                </div>

                <div class="chat-messages" id="messages-container"></div>

                <div class="chat-footer">
                    <input type="file" id="file-input" style="display: none;" onchange="uploadAndSendFile(event)">
                    <button class="btn-icon" onclick="document.getElementById('file-input').click()"
                        title="إرفاق ملف أو صورة">📎</button>
                    <input type="text" class="chat-input" id="message-input" placeholder="اكتب رسالة..."
                        onkeypress="if(event.key==='Enter') sendTextMessage()">
                    <button class="btn-icon" id="record-btn" onclick="toggleVoiceRecord()" title="تسجيل صوت">🎤</button>
                    <button class="btn-icon" onclick="sendTextMessage()" style="color: #00a884;"
                        title="إرسال">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = localStorage.getItem('chat_user') || null;
        let activeChatUser = null;
        let isRegisterMode = false;
        let onlineUsersList = [];
        let allUsers = [];

        // إعدادات التسجيل الصوتي
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // تهيئة التطبيق عند الفتح
        if (currentUser) {
            initChat();
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-alert').className = 'alert-msg';
            if (isRegisterMode) {
                document.getElementById('auth-title').innerText = 'إنشاء حساب جديد';
                document.getElementById('auth-submit').innerText = 'تسجيل حساب';
                document.getElementById('auth-toggle').innerText = 'لديك حساب بالفعل؟ تسجيل الدخول';
            } else {
                document.getElementById('auth-title').innerText = 'تسجيل الدخول';
                document.getElementById('auth-submit').innerText = 'دخول';
                document.getElementById('auth-toggle').innerText = 'ليس لديك حساب؟ إنشاء حساب جديد';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;
            const alertBox = document.getElementById('auth-alert');
            const submitBtn = document.getElementById('auth-submit');
            const url = isRegisterMode ? '/register' : '/login';

            submitBtn.disabled = true;
            submitBtn.innerText = 'يرجى الانتظار...';

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    if (isRegisterMode) {
                        alertBox.innerText = data.message;
                        alertBox.className = 'alert-msg alert-success';
                        toggleAuthMode();
                    } else {
                        currentUser = data.username;
                        localStorage.setItem('chat_user', currentUser);
                        initChat();
                    }
                } else {
                    alertBox.innerText = data.message || 'حدث خطأ غير متوقع';
                    alertBox.className = 'alert-msg alert-error';
                }
            } catch (err) {
                alertBox.innerText = 'تعذر الاتصال بالسيرفر، تحقق من الإنترنت';
                alertBox.className = 'alert-msg alert-error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isRegisterMode ? 'تسجيل حساب' : 'دخول';
            }
        }

        function initChat() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('my-name').innerText = currentUser;
            document.getElementById('my-avatar').innerText = currentUser[0].toUpperCase();
            socket.emit('user_connected', currentUser);
            loadUsers();
        }

        function logout() {
            localStorage.removeItem('chat_user');
            location.reload();
        }

        async function loadUsers() {
            try {
                const res = await fetch(`/users?current=${encodeURIComponent(currentUser)}`);
                const data = await res.json();
                if (data.success) {
                    allUsers = data.users;
                    renderUsersList();
                }
            } catch (e) {
                console.error('خطأ في جلب المستخدمين:', e);
            }
        }

        function renderUsersList() {
            const list = document.getElementById('users-list');
            const search = (document.getElementById('search-input').value || '').toLowerCase();
            list.innerHTML = '';

            allUsers
                .filter(u => u.username.toLowerCase().includes(search))
                .forEach(u => {
                    const isOnline = onlineUsersList.includes(u.username.toLowerCase());
                    const li = document.createElement('li');
                    li.className = 'user-item' + (activeChatUser === u.username ? ' active' : '');
                    li.onclick = () => selectUser(u.username);
                    li.innerHTML = `
            <div class="user-avatar">${u.username[0].toUpperCase()}</div>
            <div class="user-info">
              <div class="user-name">${u.username}</div>
              <div class="user-status">${isOnline ? '<span class="online-dot"></span> متصل الآن' : 'غير متصل'}</div>
            </div>
          `;
                    list.appendChild(li);
                });
        }

        function filterUsers() {
            renderUsersList();
        }

        function selectUser(username) {
            activeChatUser = username;
            renderUsersList();
            document.getElementById('chat-empty').style.display = 'none';
            const activeArea = document.getElementById('chat-active');
            activeArea.style.display = 'flex';
            document.getElementById('active-name').innerText = username;
            document.getElementById('active-avatar').innerText = username[0].toUpperCase();
            const isOnline = onlineUsersList.includes(username.toLowerCase());
            document.getElementById('active-status').innerText = isOnline ? 'متصل الآن' : 'آخر ظهور قريباً';

            document.getElementById('messages-container').innerHTML = '';
            socket.emit('get_history', { sender: currentUser, receiver: activeChatUser });

            if (window.innerWidth <= 768) {
                document.getElementById('app-container').classList.add('chat-active');
                document.getElementById('back-btn').style.display = 'block';
            }
        }

        function closeChat() {
            document.getElementById('app-container').classList.remove('chat-active');
            document.getElementById('back-btn').style.display = 'none';
            activeChatUser = null;
            renderUsersList();
        }

        function sendTextMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            socket.emit('private_message', {
                sender: currentUser,
                receiver: activeChatUser,
                type: 'text',
                content: text
            });
            input.value = '';
        }

        async function uploadAndSendFile(e) {
            const file = e.target.files[0];
            if (!file || !activeChatUser) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    const type = file.type.startsWith('image/') ? 'image' : 'file';
                    socket.emit('private_message', {
                        sender: currentUser,
                        receiver: activeChatUser,
                        type,
                        content: data.fileUrl
                    });
                }
            } catch (err) {
                alert('فشل رفع الملف، يرجى المحاولة مرة أخرى');
            }
            e.target.value = '';
        }

        // تسجيل وإرسال الصوتيات
        async function toggleVoiceRecord() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'voice.webm');

                        try {
                            const res = await fetch('/upload', { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.success && activeChatUser) {
                                socket.emit('private_message', {
                                    sender: currentUser,
                                    receiver: activeChatUser,
                                    type: 'audio',
                                    content: data.fileUrl
                                });
                            }
                        } catch (err) {
                            console.error(err);
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                } catch {
                    alert('يرجى السماح بالوصول للميكروفون');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            const div = document.createElement('div');
            div.className = 'msg ' + (isMe ? 'me' : 'other');

            let bodyHtml = '';
            if (msg.type === 'text') {
                bodyHtml = `<div>${escapeHtml(msg.content)}</div>`;
            } else if (msg.type === 'image') {
                bodyHtml = `<img src="${msg.content}" alt="صورة" onclick="window.open('${msg.content}')">`;
            } else if (msg.type === 'audio') {
                bodyHtml = `<audio controls src="${msg.content}"></audio>`;
            } else {
                bodyHtml = `<a href="${msg.content}" target="_blank" style="color: #53bdeb; text-decoration: underline;">📄 تحميل الملف المرفق</a>`;
            }

            div.innerHTML = `${bodyHtml}<div class="msg-time">${msg.timestamp || ''}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // استلام الأحداث من السوكيت
        socket.on('online_users', (users) => {
            onlineUsersList = users;
            renderUsersList();
            if (activeChatUser) {
                const isOnline = onlineUsersList.includes(activeChatUser.toLowerCase());
                document.getElementById('active-status').innerText = isOnline ? 'متصل الآن' : 'غير متصل';
            }
        });

        socket.on('chat_history', ({ receiver, messages }) => {
            if (activeChatUser && receiver.toLowerCase() === activeChatUser.toLowerCase()) {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                messages.forEach(appendMessage);
            }
        });

        socket.on('message_received', (msg) => {
            if (
                activeChatUser &&
                (msg.sender.toLowerCase() === activeChatUser.toLowerCase() ||
                    (msg.sender.toLowerCase() === currentUser.toLowerCase() && msg.receiver.toLowerCase() === activeChatUser.toLowerCase()))
            ) {
                appendMessage(msg);
            }
        });
    </script>
</body>

</html>
