<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #111b21;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* شاشة الدخول والتسجيل */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #0c1317;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: #111b21;
            border: 1px solid #222e35;
            padding: 30px 24px;
            border-radius: 14px;
            width: 92%;
            max-width: 400px;
            text-align: center;
            color: #e9edef;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .auth-card .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            background: #00a884;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
        }

        .auth-card h2 {
            margin-bottom: 18px;
            font-size: 22px;
            font-weight: 500;
        }

        .auth-card input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            background: #202c33;
            border: 1px solid #2a3942;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14.5px;
            outline: none;
        }

        .auth-card input:focus {
            border-color: #00a884;
        }

        .auth-card button.btn-main {
            width: 100%;
            padding: 12px;
            background: #00a884;
            color: #111b21;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 15.5px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }

        .auth-card button.btn-main:hover {
            background: #02906f;
        }

        .auth-toggle {
            margin-top: 18px;
            font-size: 13.5px;
            color: #00a884;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
        }

        .alert-box {
            padding: 10px 12px;
            margin-bottom: 14px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
            display: none;
            text-align: right;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            display: block;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            display: block;
        }

        /* الإطار الرئيسي لواتساب */
        .app-container {
            width: 100%;
            height: 100vh;
            display: flex;
            background: #111b21;
        }

        .sidebar {
            width: 360px;
            border-left: 1px solid #222e35;
            display: flex;
            flex-direction: column;
            background: #111b21;
        }

        .sidebar-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00a884;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
        }

        .search-bar {
            padding: 8px 12px;
            background: #111b21;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 14px;
            background: #202c33;
            border: none;
            border-radius: 8px;
            color: #d1d7db;
            font-size: 14px;
            outline: none;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #222e35;
            transition: 0.15s;
        }

        .user-item:hover,
        .user-item.active {
            background: #202c33;
        }

        .user-details {
            margin-right: 12px;
            flex: 1;
            text-align: right;
        }

        .user-title {
            font-size: 15.5px;
            color: #e9edef;
            font-weight: 500;
        }

        .user-sub {
            font-size: 12.5px;
            color: #8696a0;
            margin-top: 2px;
        }

        .dot-green {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #00a884;
            display: inline-block;
            margin-left: 5px;
        }

        /* منطقة الشات */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
            position: relative;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8696a0;
        }

        .chat-header {
            height: 60px;
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222e35;
        }

        .chat-header .meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .call-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#1f2c34 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            position: relative;
            word-wrap: break-word;
            color: #e9edef;
        }

        .bubble.me {
            align-self: flex-start;
            background: #005c4b;
        }

        .bubble.other {
            align-self: flex-end;
            background: #202c33;
        }

        .bubble-time {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 4px;
            text-align: left;
        }

        .bubble img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
            display: block;
            cursor: pointer;
        }

        .bubble audio {
            width: 230px;
            height: 36px;
            margin-top: 6px;
            outline: none;
        }

        .chat-footer {
            background: #202c33;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-footer input.text-input {
            flex: 1;
            padding: 10px 16px;
            background: #2a3942;
            border: none;
            border-radius: 8px;
            color: #d1d7db;
            font-size: 15px;
            outline: none;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: #d1d7db;
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-btn.recording {
            background: #ef4444 !important;
            color: white !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* شاشة المكالمات (WebRTC) */
        .call-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 20, 26, 0.96);
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 2000;
            padding: 30px 20px;
        }

        .call-videos {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 68vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #00a884;
            background: #1a1a1a;
        }

        .call-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-call {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-hangup {
            background: #ef4444;
        }

        .btn-accept {
            background: #10b981;
        }

        /* تنبيه رنين المكالمة */
        .incoming-dialog {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #202c33;
            border: 1px solid #00a884;
            padding: 15px 25px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            z-index: 3000;
            color: #e9edef;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }

            .chat-area {
                display: none;
                width: 100%;
            }

            .app-container.chat-open .sidebar {
                display: none;
            }

            .app-container.chat-open .chat-area {
                display: flex;
            }

            #local-video {
                width: 110px;
                height: 85px;
            }
        }
    </style>
</head>

<body>

    <!-- نافذة رنين المكالمة -->
    <div class="incoming-dialog" id="incoming-dialog">
        <div style="font-size: 26px;" id="incoming-icon">📞</div>
        <div>
            <div id="incoming-caller" style="font-weight: bold; font-size: 15px;"></div>
            <div style="font-size: 12px; color: #8696a0;" id="incoming-type">مكالمة واردة...</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-call btn-accept" onclick="acceptCall()"
                style="width: 42px; height: 42px; font-size: 18px;">✔</button>
            <button class="btn-call btn-hangup" onclick="rejectCall()"
                style="width: 42px; height: 42px; font-size: 18px;">✖</button>
        </div>
    </div>

    <!-- شاشة المكالمة الجارية -->
    <div class="call-overlay" id="call-overlay">
        <div style="text-align: center; color: white;">
            <h3 id="call-target-name" style="font-size: 20px;"></h3>
            <p id="call-status-text" style="font-size: 14px; color: #00a884; margin-top: 4px;">جاري الاتصال...</p>
        </div>
        <div class="call-videos">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="btn-call" style="background: #2a3942;" id="toggle-audio-btn"
                onclick="toggleAudioTrack()">🎤</button>
            <button class="btn-call" style="background: #2a3942;" id="toggle-video-btn"
                onclick="toggleVideoTrack()">📷</button>
            <button class="btn-call btn-hangup" onclick="hangUpCall()" title="إنهاء المكالمة">📞</button>
        </div>
    </div>

    <!-- واجهة تسجيل الدخول والاشتراك -->
    <div class="auth-overlay" id="auth-overlay">
        <div class="auth-card">
            <div class="logo">💬</div>
            <h2 id="auth-title">تسجيل الدخول</h2>
            <div id="auth-alert" class="alert-box"></div>

            <!-- تسجيل الدخول -->
            <form id="form-login" onsubmit="doLogin(event)">
                <input type="text" id="login-id" placeholder="اسم المستخدم أو البريد الإلكتروني" required
                    autocomplete="off">
                <input type="password" id="login-pass" placeholder="كلمة المرور" required>
                <button type="submit" class="btn-main" id="btn-login">دخول</button>
            </form>

            <!-- إنشاء الحساب -->
            <form id="form-register" style="display: none;" onsubmit="doRegister(event)">
                <input type="text" id="reg-user" placeholder="اسم المستخدم" required autocomplete="off">
                <input type="email" id="reg-email" placeholder="البريد الإلكتروني" required autocomplete="off">
                <input type="password" id="reg-pass" placeholder="كلمة المرور" required>

                <div id="otp-group" style="display: none;">
                    <input type="text" id="reg-otp" placeholder="رمز التحقق (OTP)" maxlength="6">
                </div>

                <button type="button" class="btn-main" id="btn-send-otp" onclick="requestOtp()">إرسال رمز
                    التأكيد</button>
                <button type="submit" class="btn-main" id="btn-complete-reg" style="display: none;">تأكيد الرمز وإنشاء
                    الحساب</button>
            </form>

            <a class="auth-toggle" id="auth-switch" onclick="switchAuth()">ليس لديك حساب؟ إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- واجهة واتساب ويب الأساسية -->
    <div class="app-container" id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="user-avatar" id="my-avatar">U</div>
                    <span id="my-name" style="color: #e9edef; font-weight: 500;"></span>
                </div>
                <button class="icon-btn" onclick="logout()" title="تسجيل الخروج">🚪</button>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="بحث أو بدء محادثة جديدة..." onkeyup="filterUsers()">
            </div>
            <ul class="user-list" id="users-list"></ul>
        </div>

        <div class="chat-area" id="chat-area">
            <div class="chat-empty" id="chat-empty">
                <div style="font-size: 64px; margin-bottom: 12px;">📱</div>
                <h3>واتساب للويب</h3>
                <p style="margin-top: 6px; font-size: 14px;">اختر مستخدماً من القائمة لبدء المحادثة، المكالمات الصوتية،
                    ومكالمات الفيديو</p>
            </div>

            <div id="chat-content" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <div class="meta">
                        <button class="icon-btn" onclick="backToList()" id="back-btn" style="display: none;">⬅</button>
                        <div class="user-avatar" id="active-avatar">?</div>
                        <div>
                            <div id="active-name" style="font-weight: 500; color: #e9edef;"></div>
                            <div id="active-status" style="font-size: 12px; color: #8696a0;"></div>
                        </div>
                    </div>
                    <!-- أزرار الاتصال الصوتي ومكالمة الفيديو -->
                    <div class="call-btns">
                        <button class="icon-btn" onclick="startCall(false)" title="اتصال صوتي">📞</button>
                        <button class="icon-btn" onclick="startCall(true)" title="مكالمة فيديو">📹</button>
                    </div>
                </div>

                <div class="chat-messages" id="messages-box"></div>

                <div class="chat-footer">
                    <input type="file" id="file-uploader" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="icon-btn" onclick="document.getElementById('file-uploader').click()"
                        title="إرفاق ملف أو صورة">📎</button>
                    <input type="text" class="text-input" id="message-text" placeholder="اكتب رسالة..."
                        onkeypress="if(event.key==='Enter') sendText()">
                    <button class="icon-btn" id="mic-btn" onclick="toggleVoice()" title="تسجيل صوت">🎤</button>
                    <button class="icon-btn" onclick="sendText()" style="color: #00a884;" title="إرسال">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = localStorage.getItem('chat_user') || null;
        let activeChatUser = null;
        let isRegisterMode = false;
        let onlineUsers = [];
        let contacts = [];

        // WebRTC
        let peerConnection = null;
        let localStream = null;
        let currentCallingUser = null;
        let incomingCallData = null;
        let isVideoCallActive = false;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // تسجيل الصوت
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        if (currentUser) openMainApp();

        function setAlert(msg, isSuccess = false) {
            const box = document.getElementById('auth-alert');
            box.innerHTML = msg;
            box.className = 'alert-box ' + (isSuccess ? 'alert-success' : 'alert-error');
        }

        function switchAuth() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-alert').className = 'alert-box';
            if (isRegisterMode) {
                document.getElementById('auth-title').innerText = 'إنشاء حساب جديد';
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-register').style.display = 'block';
                document.getElementById('auth-switch').innerText = 'لديك حساب بالفعل؟ تسجيل الدخول';
                document.getElementById('otp-group').style.display = 'none';
                document.getElementById('btn-send-otp').style.display = 'block';
                document.getElementById('btn-complete-reg').style.display = 'none';
            } else {
                document.getElementById('auth-title').innerText = 'تسجيل الدخول';
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
                document.getElementById('auth-switch').innerText = 'ليس لديك حساب؟ إنشاء حساب جديد';
            }
        }

        // 1. طلب رمز التأكيد (يعبئه فوراً حتى مع حظر المنفذ)
        async function requestOtp() {
            const username = document.getElementById('reg-user').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const btn = document.getElementById('btn-send-otp');

            if (!username || !email) {
                setAlert('يرجى ملء اسم المستخدم والبريد الإلكتروني أولاً');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري التجهيز...';

            try {
                const res = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    setAlert(data.message, true);
                    document.getElementById('otp-group').style.display = 'block';
                    document.getElementById('btn-send-otp').style.display = 'none';
                    document.getElementById('btn-complete-reg').style.display = 'block';
                    if (data.otp) {
                        document.getElementById('reg-otp').value = data.otp; // تعبئة تلقائية
                    }
                } else {
                    setAlert(data.message || 'تعذر الحصول على الرمز');
                }
            } catch (e) {
                setAlert('فشل الاتصال بالسيرفر');
            } finally {
                btn.disabled = false;
                btn.innerText = 'إرسال رمز التأكيد';
            }
        }

        // 2. إنشاء الحساب
        async function doRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-user').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            const otp = document.getElementById('reg-otp').value.trim();
            const btn = document.getElementById('btn-complete-reg');

            if (!otp) {
                setAlert('يرجى إدخال رمز التحقق');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جاري التحقق...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, otp })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    switchAuth();
                    setAlert('تم إنشاء الحساب وتفعيله بنجاح! سجّل دخولك الآن', true);
                    document.getElementById('login-id').value = username;
                } else {
                    setAlert(data.message || 'فشل التسجيل');
                }
            } catch (e) {
                setAlert('تعذر إكمال التسجيل');
            } finally {
                btn.disabled = false;
                btn.innerText = 'تأكيد الرمز وإنشاء الحساب';
            }
        }

        // 3. الدخول
        async function doLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-pass').value;
            const btn = document.getElementById('btn-login');

            btn.disabled = true;
            btn.innerText = 'جاري الدخول...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    currentUser = data.username;
                    localStorage.setItem('chat_user', currentUser);
                    openMainApp();
                } else {
                    setAlert(data.message || 'بيانات الدخول غير صحيحة');
                }
            } catch (e) {
                setAlert('فشل الاتصال بالسيرفر');
            } finally {
                btn.disabled = false;
                btn.innerText = 'دخول';
            }
        }

        function openMainApp() {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('my-name').innerText = currentUser;
            document.getElementById('my-avatar').innerText = currentUser[0].toUpperCase();
            socket.emit('user_connected', currentUser);
            fetchContacts();
        }

        function logout() {
            localStorage.removeItem('chat_user');
            location.reload();
        }

        async function fetchContacts() {
            try {
                const res = await fetch(`/api/users?current=${encodeURIComponent(currentUser)}`);
                const data = await res.json();
                if (data.success) {
                    contacts = data.users;
                    renderContacts();
                }
            } catch (e) { }
        }

        function renderContacts() {
            const list = document.getElementById('users-list');
            const q = (document.getElementById('search-input').value || '').toLowerCase();
            list.innerHTML = '';

            contacts
                .filter(u => u.username.toLowerCase().includes(q) || (u.email && u.email.toLowerCase().includes(q)))
                .forEach(u => {
                    const isOnline = onlineUsers.includes(u.username.toLowerCase());
                    const li = document.createElement('li');
                    li.className = 'user-item' + (activeChatUser === u.username ? ' active' : '');
                    li.onclick = () => startChatWith(u.username);
                    li.innerHTML = `
            <div class="user-avatar">${u.username[0].toUpperCase()}</div>
            <div class="user-details">
              <div class="user-title">${u.username}</div>
              <div class="user-sub">${isOnline ? '<span class="dot-green"></span> متصل الآن' : 'غير متصل'}</div>
            </div>
          `;
                    list.appendChild(li);
                });
        }

        function filterUsers() {
            renderContacts();
        }

        function startChatWith(user) {
            activeChatUser = user;
            renderContacts();
            document.getElementById('chat-empty').style.display = 'none';
            document.getElementById('chat-content').style.display = 'flex';
            document.getElementById('active-name').innerText = user;
            document.getElementById('active-avatar').innerText = user[0].toUpperCase();
            const isOnline = onlineUsers.includes(user.toLowerCase());
            document.getElementById('active-status').innerText = isOnline ? 'متصل الآن' : 'آخر ظهور قريباً';

            document.getElementById('messages-box').innerHTML = '';
            socket.emit('get_history', { sender: currentUser, receiver: activeChatUser });

            if (window.innerWidth <= 768) {
                document.getElementById('app-container').classList.add('chat-open');
                document.getElementById('back-btn').style.display = 'block';
            }
        }

        function backToList() {
            document.getElementById('app-container').classList.remove('chat-open');
            document.getElementById('back-btn').style.display = 'none';
            activeChatUser = null;
            renderContacts();
        }

        function sendText() {
            const input = document.getElementById('message-text');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            socket.emit('private_message', {
                sender: currentUser,
                receiver: activeChatUser,
                type: 'text',
                content: text
            });
            input.value = '';
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file || !activeChatUser) return;

            const fd = new FormData();
            fd.append('file', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.success) {
                    const type = file.type.startsWith('image/') ? 'image' : 'file';
                    socket.emit('private_message', {
                        sender: currentUser,
                        receiver: activeChatUser,
                        type,
                        content: data.fileUrl,
                        fileName: data.fileName
                    });
                }
            } catch (e) {
                alert('فشل رفع الملف');
            }
            e.target.value = '';
        }

        async function toggleVoice() {
            const btn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fd = new FormData();
                        fd.append('file', blob, 'voice.webm');

                        try {
                            const res = await fetch('/api/upload', { method: 'POST', body: fd });
                            const data = await res.json();
                            if (data.success && activeChatUser) {
                                socket.emit('private_message', {
                                    sender: currentUser,
                                    receiver: activeChatUser,
                                    type: 'audio',
                                    content: data.fileUrl
                                });
                            }
                        } catch (err) { }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                } catch {
                    alert('يرجى السماح بالوصول إلى الميكروفون');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages-box');
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            const div = document.createElement('div');
            div.className = 'bubble ' + (isMe ? 'me' : 'other');

            let body = '';
            if (msg.type === 'text') {
                body = `<div>${escapeHtml(msg.content)}</div>`;
            } else if (msg.type === 'image') {
                body = `<img src="${msg.content}" onclick="window.open('${msg.content}')" alt="صورة">`;
            } else if (msg.type === 'audio') {
                body = `<audio controls src="${msg.content}"></audio>`;
            } else {
                body = `<a href="${msg.content}" target="_blank" style="color: #53bdeb; text-decoration: underline;">📄 ${escapeHtml(msg.fileName || 'ملف مرفق')}</a>`;
            }

            div.innerHTML = `${body}<div class="bubble-time">${msg.timestamp || ''} ${isMe ? '✓✓' : ''}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(t) {
            return (t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // ============================================
        // الاتصال الصوتي ومكالمات الفيديو (WebRTC)
        // ============================================

        async function initMedia(video) {
            isVideoCallActive = video;
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('local-video').style.display = video ? 'block' : 'none';
        }

        function createPeer(targetUser) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { to: targetUser, candidate: event.candidate });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'connected') {
                    document.getElementById('call-status-text').innerText = 'المكالمة متصلة الآن';
                }
            };
        }

        async function startCall(isVideo) {
            if (!activeChatUser) return;
            currentCallingUser = activeChatUser;
            try {
                await initMedia(isVideo);
                createPeer(currentCallingUser);

                document.getElementById('call-target-name').innerText = currentCallingUser;
                document.getElementById('call-status-text').innerText = isVideo ? 'جاري الاتصال بالفيديو...' : 'جاري الاتصال الصوتي...';
                document.getElementById('call-overlay').style.display = 'flex';

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.emit('call_user', { to: currentCallingUser, offer, isVideo, from: currentUser });
            } catch (err) {
                alert('تعذر فتح الكاميرا أو الميكروفون: ' + err.message);
            }
        }

        socket.on('incoming_call', ({ from, offer, isVideo }) => {
            incomingCallData = { from, offer, isVideo };
            document.getElementById('incoming-caller').innerText = from;
            document.getElementById('incoming-type').innerText = isVideo ? 'مكالمة فيديو واردة...' : 'مكالمة صوتية واردة...';
            document.getElementById('incoming-icon').innerText = isVideo ? '📹' : '📞';
            document.getElementById('incoming-dialog').style.display = 'flex';
        });

        async function acceptCall() {
            document.getElementById('incoming-dialog').style.display = 'none';
            if (!incomingCallData) return;

            currentCallingUser = incomingCallData.from;
            try {
                await initMedia(incomingCallData.isVideo);
                createPeer(currentCallingUser);

                document.getElementById('call-target-name').innerText = currentCallingUser;
                document.getElementById('call-status-text').innerText = 'جاري الاتصال...';
                document.getElementById('call-overlay').style.display = 'flex';

                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('answer_call', { to: currentCallingUser, answer });
            } catch (err) {
                alert('تعذر فتح الكاميرا أو الميكروفون: ' + err.message);
            }
        }

        function rejectCall() {
            document.getElementById('incoming-dialog').style.display = 'none';
            if (incomingCallData) {
                socket.emit('reject_call', { to: incomingCallData.from });
                incomingCallData = null;
            }
        }

        function hangUpCall() {
            if (currentCallingUser) {
                socket.emit('end_call', { to: currentCallingUser });
            }
            closeCallUI();
        }

        function closeCallUI() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('local-video').srcObject = null;
            document.getElementById('call-overlay').style.display = 'none';
            document.getElementById('incoming-dialog').style.display = 'none';
            currentCallingUser = null;
            incomingCallData = null;
        }

        function toggleAudioTrack() {
            if (localStream) {
                const audio = localStream.getAudioTracks()[0];
                if (audio) {
                    audio.enabled = !audio.enabled;
                    document.getElementById('toggle-audio-btn').style.background = audio.enabled ? '#2a3942' : '#ef4444';
                }
            }
        }

        function toggleVideoTrack() {
            if (localStream) {
                const video = localStream.getVideoTracks()[0];
                if (video) {
                    video.enabled = !video.enabled;
                    document.getElementById('toggle-video-btn').style.background = video.enabled ? '#2a3942' : '#ef4444';
                }
            }
        }

        socket.on('call_accepted', async ({ answer }) => {
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        socket.on('ice_candidate', async ({ candidate }) => {
            try {
                if (peerConnection && candidate) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                }
            } catch (e) { }
        });

        socket.on('call_rejected', () => {
            alert('تم رفض المكالمة');
            closeCallUI();
        });

        socket.on('call_ended', () => {
            alert('تم إنهاء المكالمة');
            closeCallUI();
        });

        socket.on('call_failed', ({ message }) => {
            alert(message);
            closeCallUI();
        });

        // مزامنة الاتصال والرسائل
        socket.on('online_users', users => {
            onlineUsers = users;
            renderContacts();
            if (activeChatUser) {
                const isOnline = onlineUsers.includes(activeChatUser.toLowerCase());
                document.getElementById('active-status').innerText = isOnline ? 'متصل الآن' : 'غير متصل';
            }
        });

        socket.on('chat_history', ({ receiver, messages }) => {
            if (activeChatUser && receiver.toLowerCase() === activeChatUser.toLowerCase()) {
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                messages.forEach(appendMessage);
            }
        });

        socket.on('message_received', msg => {
            if (
                activeChatUser &&
                (msg.sender.toLowerCase() === activeChatUser.toLowerCase() ||
                    (msg.sender.toLowerCase() === currentUser.toLowerCase() && msg.receiver.toLowerCase() === activeChatUser.toLowerCase()))
            ) {
                appendMessage(msg);
            }
        });
    </script>
</body>
