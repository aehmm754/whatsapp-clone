<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #d1d7db;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        .btn-green {
            width: 100%;
            padding: 10px;
            background: #00a884;
            color: white;
            font-weight: bold;
            margin-top: 8px;
        }

        #appContainer {
            display: none;
            width: 95%;
            max-width: 1200px;
            height: 92vh;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .sidebar {
            width: 350px;
            border-left: 1px solid #e9edef;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background: #f0f2f5;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e9edef;
            font-weight: bold;
        }

        .search-box {
            padding: 10px;
            border-bottom: 1px solid #e9edef;
            display: flex;
            gap: 6px;
        }

        .search-box input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        .list-area {
            flex: 1;
            overflow-y: auto;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f2f2f2;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            background: #f5f6f6;
        }

        .list-item.active {
            background: #ebebeb;
            font-weight: bold;
        }

        .section-title {
            font-size: 12px;
            color: #8696a0;
            padding: 8px 15px;
            background: #fcfcfc;
            font-weight: bold;
        }

        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #efeae2;
            position: relative;
        }

        .chat-view-header {
            background: #f0f2f5;
            padding: 12px 20px;
            font-weight: bold;
            border-bottom: 1px solid #e9edef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .call-actions {
            display: flex;
            gap: 8px;
        }

        .btn-call {
            background: #00a884;
            color: white;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }

        .bubble-me {
            background: #d9fdd3;
            align-self: flex-end;
            border-top-left-radius: 0;
        }

        .bubble-other {
            background: #ffffff;
            align-self: flex-start;
            border-top-right-radius: 0;
        }

        .bubble img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }

        .bubble audio {
            margin-top: 5px;
            width: 240px;
        }

        .chat-footer {
            background: #f0f2f5;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-footer input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #fff;
            outline: none;
        }

        .icon-btn {
            background: none;
            font-size: 20px;
            padding: 5px 8px;
            border-radius: 50%;
        }

        .recording {
            color: red;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* شاشة المكالمة الكاملة (صوت وفيديو) */
        .call-screen {
            position: absolute;
            inset: 0;
            background: #0c1317;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #localVideo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid white;
            z-index: 210;
            background: #222;
        }

        .call-controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            z-index: 220;
        }

        .btn-hangup {
            background: #ea0038;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
        }

        .call-info {
            position: absolute;
            top: 30px;
            color: white;
            font-size: 18px;
            z-index: 220;
            font-weight: bold;
        }

        /* نافذة الرد على المكالمة الواردة */
        .incoming-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111b21;
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 300;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .btn-accept {
            background: #00a884;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- تسجيل الدخول -->
    <div class="auth-card" id="authBox">
        <div id="loginForm">
            <h2 style="margin-bottom: 15px; color: #075e54;">تسجيل الدخول</h2>
            <div class="input-group"><label>اسم المستخدم</label><input type="text" id="loginUsername"></div>
            <div class="input-group"><label>كلمة المرور</label><input type="password" id="loginPassword"></div>
            <button class="btn-green" onclick="login()">دخول</button>
            <p style="margin-top:15px; font-size:13px; text-align:center; color:#075e54; cursor:pointer;"
                onclick="toggleAuth('register')">إنشاء حساب جديد</p>
        </div>

        <div id="registerForm" style="display: none;">
            <h2 style="margin-bottom: 15px; color: #075e54;">إنشاء حساب</h2>
            <div class="input-group"><label>اسم المستخدم</label><input type="text" id="regUsername"></div>
            <div class="input-group"><label>البريد</label><input type="email" id="regEmail"></div>
            <div class="input-group"><label>كلمة المرور</label><input type="password" id="regPassword"></div>
            <button class="btn-green" onclick="register()">إرسال كود التفعيل</button>
            <p style="margin-top:15px; font-size:13px; text-align:center; color:#075e54; cursor:pointer;"
                onclick="toggleAuth('login')">تسجيل الدخول</p>
        </div>

        <div id="otpForm" style="display: none;">
            <h2 style="margin-bottom: 10px; color: #075e54;">تأكيد الرمز</h2>
            <input type="text" id="otpCode" placeholder="123456" maxlength="6"
                style="width:100%; text-align:center; font-size:22px; padding:8px; margin:15px 0;">
            <button class="btn-green" onclick="verifyOtp()">تأكيد</button>
        </div>
    </div>

    <!-- واجهة التطبيق -->
    <div id="appContainer">
        <!-- تنبيه الرنين الوارد -->
        <div class="incoming-box" id="incomingBox">
            <span id="incomingText">مكالمة واردة...</span>
            <button class="btn-accept" onclick="acceptIncomingCall()">رد</button>
            <button class="btn-hangup" style="padding: 8px 18px;" onclick="rejectIncomingCall()">رفض</button>
        </div>

        <!-- نافذة المكالمة الجارية الشاملة -->
        <div class="call-screen" id="callScreen">
            <div class="call-info" id="callStatusText">جارٍ الاتصال...</div>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="call-controls">
                <button class="btn-hangup" onclick="endCall()">إنهاء المكالمة ❌</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <span id="myUsernameDisplay">أنا</span>
                <button onclick="location.reload()"
                    style="background:#dc3545; color:#fff; padding:4px 8px; font-size:12px;">خروج</button>
            </div>
            <div class="search-box">
                <input type="text" id="userSearchInput" placeholder="بحث عن يوزر...">
                <button onclick="searchUsers()" style="padding:6px 12px; background:#00a884; color:#fff;">بحث</button>
            </div>
            <div class="list-area">
                <div id="searchResultsArea" style="display: none;">
                    <div class="section-title">نتائج البحث</div>
                    <div id="searchResultsList"></div>
                </div>
                <div class="section-title">طلبات المحادثة الواردة</div>
                <div id="pendingRequestsList"></div>
                <div class="section-title">المحادثات المعتمدة</div>
                <div id="contactsList"></div>
            </div>
        </div>

        <div class="chat-view">
            <div class="chat-view-header">
                <span id="activeChatHeader">اختر محادثة للبدء</span>
                <div class="call-actions" id="callActions" style="display:none;">
                    <button class="btn-call" onclick="startCall(false)">📞 اتصال صوتي</button>
                    <button class="btn-call" style="background:#128c7e;" onclick="startCall(true)">📹 مكالمة
                        فيديو</button>
                </div>
            </div>

            <div class="chat-messages" id="chatArea"></div>

            <div class="chat-footer" id="chatFooter" style="display: none;">
                <input type="file" id="fileInput" accept="image/*" style="display: none;"
                    onchange="uploadAndSendMedia(this)">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <button class="icon-btn" id="voiceBtn" onclick="toggleVoiceRecord()">🎤</button>
                <input type="text" id="msgText" placeholder="اكتب رسالة..." autocomplete="off">
                <button onclick="sendTextMessage()"
                    style="padding: 8px 16px; background:#00a884; color:#fff;">إرسال</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let currentUser = null;
        let activeChatUser = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // حالة المكالمات و WebRTC
        let peerConnection = null;
        let localStream = null;
        let incomingCallData = null;
        let currentCallTargetId = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function toggleAuth(v) {
            document.getElementById('loginForm').style.display = v === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = v === 'register' ? 'block' : 'none';
            document.getElementById('otpForm').style.display = v === 'otp' ? 'block' : 'none';
        }

        async function register() {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('regUsername').value.trim(),
                    email: document.getElementById('regEmail').value.trim(),
                    password: document.getElementById('regPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) toggleAuth('otp'); else alert(data.error);
        }

        async function verifyOtp() {
            const res = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('regEmail').value.trim(),
                    otp: document.getElementById('otpCode').value.trim()
                })
            });
            const data = await res.json();
            if (res.ok) { alert(data.message); toggleAuth('login'); } else alert(data.error);
        }

        async function login() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('loginUsername').value.trim(),
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                initApp();
            } else alert(data.error);
        }

        function initApp() {
            document.getElementById('authBox').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('myUsernameDisplay').textContent = `@${currentUser.username}`;

            socket = io();
            socket.emit('join', currentUser.id);

            socket.on('receive_private_message', (msg) => {
                if (activeChatUser && (msg.senderId == activeChatUser.id || msg.receiverId == activeChatUser.id)) {
                    appendMessage(msg);
                }
            });

            socket.on('new_request', () => loadContactsData());

            // استقبال مكالمة
            socket.on('incoming_call', (data) => {
                incomingCallData = data;
                currentCallTargetId = data.from;
                const typeText = data.isVideo ? 'فيديو' : 'صوتية';
                document.getElementById('incomingText').textContent = `مكالمة ${typeText} واردة من @${data.callerName}...`;
                document.getElementById('incomingBox').style.display = 'flex';
            });

            socket.on('call_accepted', async (signal) => {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
                document.getElementById('callStatusText').textContent = 'المكالمة جارية 🟢';
            });

            socket.on('ice_candidate', async (candidate) => {
                if (peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) { }
                }
            });

            // إشعار إنهاء المكالمة من الطرف الآخر
            socket.on('call_ended', () => {
                closeCallLocally();
            });

            loadContactsData();
        }

        // إعداد الاتصال والوسائط
        async function prepareMedia(withVideo) {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('localVideo').style.display = withVideo ? 'block' : 'none';

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && currentCallTargetId) {
                    socket.emit('ice_candidate', { to: currentCallTargetId, candidate: event.candidate });
                }
            };
        }

        async function startCall(isVideo) {
            if (!activeChatUser) return;
            currentCallTargetId = activeChatUser.id;

            try {
                await prepareMedia(isVideo);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.emit('call_user', {
                    userToCall: activeChatUser.id,
                    signalData: offer,
                    callerId: currentUser.id,
                    callerName: currentUser.username,
                    isVideo: isVideo
                });

                document.getElementById('callStatusText').textContent = `جارٍ الاتصال بـ @${activeChatUser.username}...`;
                document.getElementById('callScreen').style.display = 'flex';
            } catch (err) {
                alert('تعذر الوصول للكاميرا أو الميكروفون. تأكد من إعطاء الصلاحية في المتصفح.');
            }
        }

        async function acceptIncomingCall() {
            document.getElementById('incomingBox').style.display = 'none';
            try {
                await prepareMedia(incomingCallData.isVideo);
                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.signal));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('accept_call', { to: incomingCallData.from, signal: answer });

                document.getElementById('callStatusText').textContent = 'المكالمة جارية 🟢';
                document.getElementById('callScreen').style.display = 'flex';
            } catch (err) {
                alert('حدث خطأ أثناء فتح الكاميرا أو الميكروفون.');
                endCall();
            }
        }

        function rejectIncomingCall() {
            if (incomingCallData) {
                socket.emit('end_call', { to: incomingCallData.from });
            }
            document.getElementById('incomingBox').style.display = 'none';
            incomingCallData = null;
            currentCallTargetId = null;
        }

        // إنهاء المكالمة وإرسال التنبيه للطرف الآخر
        function endCall() {
            if (currentCallTargetId) {
                socket.emit('end_call', { to: currentCallTargetId });
            }
            closeCallLocally();
        }

        function closeCallLocally() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('callScreen').style.display = 'none';
            document.getElementById('incomingBox').style.display = 'none';
            incomingCallData = null;
            currentCallTargetId = null;
        }

        // دوال المراسلة والبحث
        async function searchUsers() {
            const q = document.getElementById('userSearchInput').value.trim();
            if (!q) return;
            const res = await fetch(`/api/users/search?q=${q}&currentUserId=${currentUser.id}`);
            const users = await res.json();
            const box = document.getElementById('searchResultsArea');
            const list = document.getElementById('searchResultsList');
            box.style.display = 'block';
            list.innerHTML = users.length ? '' : '<div style="padding:10px;font-size:13px;">لا توجد نتائج</div>';

            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `<span>@${u.username}</span><button onclick="sendRequest(${u.id})" style="padding:4px 8px;background:#00a884;color:#fff;">طلب محادثة</button>`;
                list.appendChild(item);
            });
        }

        async function sendRequest(receiverId) {
            const res = await fetch('/api/requests/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderId: currentUser.id, receiverId })
            });
            const data = await res.json();
            alert(data.message || data.error);
        }

        async function loadContactsData() {
            const res = await fetch(`/api/contacts/data?userId=${currentUser.id}`);
            const data = await res.json();

            const reqList = document.getElementById('pendingRequestsList');
            reqList.innerHTML = data.pendingRequests.length ? '' : '<div style="padding:10px;font-size:12px;color:#999;">لا توجد طلبات جديدة</div>';
            data.pendingRequests.forEach(r => {
                const d = document.createElement('div');
                d.className = 'list-item';
                d.innerHTML = `<span>@${r.username}</span><div>
          <button onclick="respondRequest(${r.requestId}, 'accepted')" style="background:#00a884;color:#fff;padding:3px 6px;">قبول</button>
          <button onclick="respondRequest(${r.requestId}, 'rejected')" style="background:#dc3545;color:#fff;padding:3px 6px;">رفض</button>
        </div>`;
                reqList.appendChild(d);
            });

            const cList = document.getElementById('contactsList');
            cList.innerHTML = data.contacts.length ? '' : '<div style="padding:10px;font-size:12px;color:#999;">لا توجد محادثات</div>';
            data.contacts.forEach(c => {
                const d = document.createElement('div');
                d.className = `list-item ${activeChatUser && activeChatUser.id === c.id ? 'active' : ''}`;
                d.textContent = `@${c.username}`;
                d.onclick = () => openChat(c);
                cList.appendChild(d);
            });
        }

        async function respondRequest(requestId, status) {
            await fetch('/api/requests/respond', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ requestId, status })
            });
            loadContactsData();
        }

        async function openChat(target) {
            activeChatUser = target;
            document.getElementById('activeChatHeader').textContent = `محادثة مع @${target.username}`;
            document.getElementById('callActions').style.display = 'flex';
            document.getElementById('chatFooter').style.display = 'flex';
            loadContactsData();

            const res = await fetch(`/api/messages?userId=${currentUser.id}&targetId=${target.id}`);
            const messages = await res.json();
            const area = document.getElementById('chatArea');
            area.innerHTML = '';
            messages.forEach(m => appendMessage({
                senderId: m.sender_id,
                receiverId: m.receiver_id,
                type: m.type,
                content: m.content
            }));
        }

        function appendMessage(msg) {
            const area = document.getElementById('chatArea');
            const bubble = document.createElement('div');
            const isMe = msg.senderId == currentUser.id;
            bubble.className = `bubble ${isMe ? 'bubble-me' : 'bubble-other'}`;

            if (msg.type === 'text') bubble.textContent = msg.content;
            else if (msg.type === 'image') bubble.innerHTML = `<img src="${msg.content}">`;
            else if (msg.type === 'audio') bubble.innerHTML = `<audio controls src="${msg.content}"></audio>`;

            area.appendChild(bubble);
            area.scrollTop = area.scrollHeight;
        }

        function sendTextMessage() {
            const input = document.getElementById('msgText');
            const text = input.value.trim();
            if (!text || !activeChatUser) return;

            socket.emit('send_private_message', {
                senderId: currentUser.id,
                receiverId: activeChatUser.id,
                type: 'text',
                content: text
            });
            input.value = '';
        }

        async function uploadAndSendMedia(input) {
            if (!input.files[0] || !activeChatUser) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);

            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();

            socket.emit('send_private_message', {
                senderId: currentUser.id,
                receiverId: activeChatUser.id,
                type: 'image',
                content: data.fileUrl
            });
            input.value = '';
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('voiceBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append('file', audioBlob, 'voice.webm');

                        const res = await fetch('/api/upload', { method: 'POST', body: formData });
                        const data = await res.json();

                        socket.emit('send_private_message', {
                            senderId: currentUser.id,
                            receiverId: activeChatUser.id,
                            type: 'audio',
                            content: data.fileUrl
                        });
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                } catch {
                    alert('يرجى السماح بالوصول للميكروفون');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
            }
        }
    </script>
</body>

</html>
